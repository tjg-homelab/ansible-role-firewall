---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: firewall-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/sbin/init
  - name: firewall-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/sbin/init
  - name: firewall-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/sbin/init
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  config_options:
    defaults:
      remote_tmp: /var/tmp/.ansible/tmp
  inventory:
    group_vars:
      all:
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    # AN-101: `check` runs converge.yml with --check on a host that has NEVER
    # been converged for real -- no ansible_managed table exists yet. This is
    # exactly the role's own documented safe-rollout workflow ("--check, then
    # --limit a single low-value host") and exactly the scenario that used to
    # fail: the SSH-reachability assert depended on a command task that
    # --check always skips, with no ansible_check_mode guard of its own.
    - check
    - converge
    - verify
    - idempotence
    - destroy
